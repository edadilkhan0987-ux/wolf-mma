<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peculiar Atelier — Unusual by intent</title>
    <meta name="description" content="Peculiar Atelier. Unusual by intent. Tug the cloth, I dare you.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://d2ol7oe51mr4n9.cloudfront.net" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper: #e3e4e9;
            --paper-edge: #cfd1d9;
            --ink: #000000;
            --ink-soft: rgba(0, 0, 0, 0.5);
            --violet: #5b07fb;
            --violet-deep: #4a00d6;
            --white: #ffffff;
            --gutter: clamp(20px, 3.2vw, 46px);
            --display: clamp(44px, min(7.65vw, 13.6vh), 168px);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--paper);
            font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .hero {
            position: relative;
            height: 100vh;
            height: 100svh;
            min-height: 480px;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(120% 95% at 58% 38%, #e8e9ed 0%, var(--paper) 46%, var(--paper-edge) 100%);
        }

        .hero__cloth {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .hero__cloth.is-over { cursor: grab; }
        .hero__cloth.is-held { cursor: grabbing; }
        .hero__cloth:focus-visible {
            outline: 2px solid var(--violet);
            outline-offset: -6px;
        }

        .hero__still {
            position: absolute;
            left: 40%;
            top: 48.5%;
            width: min(64vw, 84vh);
            aspect-ratio: 1/1;
            object-fit: cover;
            transform: translate(-50%, -50%) rotate(5deg);
            box-shadow: -18px 40px 70px rgba(20, 20, 40, 0.22);
            display: none;
        }

        .hero.no-cloth .hero__cloth {
            display: none;
        }
        .hero.no-cloth .hero__still {
            display: block;
        }

        .nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px var(--gutter) 0;
            pointer-events: none;
        }
        .nav > * {
            pointer-events: auto;
        }

        .nav__logo {
            font-size: 19px;
            font-weight: 400;
            letter-spacing: -0.045em;
            line-height: 36px;
            color: var(--ink);
            text-decoration: none;
        }
        .nav__logo:focus-visible {
            outline: 2px solid var(--violet);
            outline-offset: 3px;
        }

        .nav__actions {
            display: flex;
            gap: 12px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            height: 36px;
            padding: 0 18px;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.045em;
            line-height: 1;
            color: var(--white);
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s;
        }
        .pill:hover {
            transform: translateY(-1px);
        }
        .pill:active {
            transform: scale(0.98);
        }
        .pill:focus-visible {
            outline: 2px solid var(--violet);
            outline-offset: 3px;
        }

        .pill--menu {
            background-color: var(--ink);
            padding-left: 16px;
        }
        .pill--menu:hover {
            background-color: #1b1b1f;
        }

        .pill--start {
            background-color: var(--violet);
        }
        .pill--start:hover {
            background-color: var(--violet-deep);
        }
        .pill--start:focus-visible {
            outline-color: var(--ink);
        }

        .burger {
            display: grid;
            gap: 4px;
            width: 24px;
        }
        .burger i {
            display: block;
            height: 1.5px;
            background-color: var(--white);
            border-radius: 1px;
            transition: transform 0.25s;
        }
        .pill--menu:hover .burger i:first-child {
            transform: translateX(-2px);
        }
        .pill--menu:hover .burger i:last-child {
            transform: translateX(2px);
        }

        .hero__title {
            position: absolute;
            z-index: 1;
            left: 66.9%;
            top: 48.4%;
            transform: translateY(-50%);
            margin: 0;
            font-size: var(--display);
            font-weight: 500;
            line-height: 0.99;
            letter-spacing: -0.06em;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            color: var(--ink);
        }
        .hero__title span {
            display: block;
            animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        .hero__title .soft {
            color: var(--ink-soft);
            animation-delay: 0.08s;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1099px), (max-aspect-ratio: 5/4) {
            :root {
                --display: clamp(44px, min(12.4vw, 11vh), 120px);
            }
            .hero__title {
                left: var(--gutter);
                top: auto;
                bottom: clamp(20px, 4vh, 44px);
                transform: none;
            }
            .hero__still {
                left: 50%;
                top: 44%;
                width: min(78vw, 60vh);
            }
        }

        @media (max-width: 520px) {
            .pill--start {
                display: none;
            }
            .nav__logo {
                font-size: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero__title span, .pill, .burger i {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<section class="hero" id="hero" aria-label="Peculiar Atelier">
    <canvas class="hero__cloth" id="cloth" role="img" tabindex="-1" aria-label="A violet holographic cloth showing a chrome octopus beneath the words Strange by design. Grab it then tug it around."></canvas>
    
    <img class="hero__still" id="still" alt="" decoding="async" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/9212999e-7a4a-4f70-bc34-e4e1c4533b81.jpg">

    <header class="nav">
        <a class="nav__logo" href="#hero">Peculiar Atelier</a>
        <div class="nav__actions">
            <button class="pill pill--menu" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>More
            </button>
            <a class="pill pill--start" href="#start">Start a brief</a>
        </div>
    </header>

    <h1 class="hero__title"><span>Grab me</span><span class="soft">I dare you</span></h1>
</section>

<script>
    (() => {
        const hero = document.getElementById('hero');
        const canvas = document.getElementById('cloth');
        const still = document.getElementById('still');
        const imgUrl = "https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/9212999e-7a4a-4f70-bc34-e4e1c4533b81.jpg";

        let gl;
        try {
            gl = canvas.getContext('webgl', { alpha: true, antialias: true, premultipliedAlpha: true, powerPreference: 'high-performance' }) || 
                 canvas.getContext('experimental-webgl', { alpha: true, antialias: true, premultipliedAlpha: true, powerPreference: 'high-performance' });
        } catch(e) {}

        if (!gl) {
            hero.classList.add('no-cloth');
            return;
        }

        // --- SHADERS ---
        const vsSource = `
            attribute vec3 aPos;
            attribute vec3 aNormal;
            attribute vec2 aUv;
            uniform vec2 uResolution;
            varying vec3 vNormal;
            varying vec2 vUv;
            varying vec3 vViewPos;
            
            void main() {
                vUv = aUv;
                vNormal = aNormal;
                vViewPos = aPos;
                
                float aspectRatio = uResolution.x / uResolution.y;
                float cx = 0.402;
                float cy = 0.485;
                float CH = 0.90;
                float aspect = 1.12;
                float CW = CH * aspect;
                float zoom = min(1.0, 0.58 * aspectRatio / (CW * 1.12));
                
                vec2 screen = aPos.xy * zoom;
                float x = 2.0 * (cx + screen.x / aspectRatio) - 1.0;
                float y = 1.0 - 2.0 * (cy - screen.y);
                float z = -aPos.z * 0.5;
                gl_Position = vec4(x, y, z, 1.0);
            }
        `;

        const fsSource = `
            precision highp float;
            varying vec3 vNormal;
            varying vec2 vUv;
            varying vec3 vViewPos;
            uniform sampler2D uTexture;
            uniform float uHasTexture;
            
            #define PI 3.14159265359
            
            float ridge(float x) {
                return sqrt(sin(x)*sin(x) + 0.03) - 0.64;
            }
            
            float box(vec3 dir, vec3 centre, vec2 halfSize, float soft) {
                vec3 d = dir - centre;
                vec2 p = abs(d.xy) - halfSize;
                float f = max(p.x, p.y);
                return 1.0 - smoothstep(-soft, soft, f);
            }
            
            vec3 rainbow(float p) {
                return clamp(vec3(0.74, 0.58, 0.96) + vec3(0.26, 0.24, 0.10) * cos(2.0 * PI * (p + vec3(0.0, 0.28, 0.62))), 0.0, 1.0);
            }
            
            void main() {
                vec3 n = normalize(vNormal);
                bool back = n.z < 0.0;
                if (back) n = -n;
                
                float CAM = 4.0; // Approx
                vec3 V = normalize(vec3(0.0, 0.0, CAM) - vViewPos);
                vec3 Rf = reflect(-V, n);
                vec3 KEY = normalize(vec3(-0.42, 0.45, 0.79));
                float nv = clamp(dot(n, V), 0.0, 1.0);
                float nl = max(dot(n, KEY), 0.0);
                
                vec3 print = vec3(0.10, 0.02, 0.32);
                if (uHasTexture > 0.5) {
                    print = pow(texture2D(uTexture, vUv).rgb, vec3(2.2));
                }
                
                float shade = 0.46 + 0.68 * nl + 0.08 * n.y;
                float key = pow(max(dot(Rf, KEY), 0.0), 26.0);
                
                float strip = box(Rf, normalize(vec3(0.08, 0.93, 0.36)), vec2(1.1, 0.07), 0.22);
                float side = box(Rf, normalize(vec3(0.86, 0.12, 0.50)), vec2(0.06, 0.85), 0.20);
                float fill = box(Rf, KEY, vec2(0.42, 0.30), 0.35);
                
                float phase = 3.0 * (0.85 * dot(n.xy, vec2(0.6, 0.8)) + 0.75 * (1.0 - nv) + 0.3 * dot(Rf.xy, vec2(-0.8, 0.6))) + 0.4 * sin(5.0 * vUv.x + 7.0 * vUv.y);
                
                vec3 holo = mix(vec3(1.0), rainbow(phase)*rainbow(phase), 0.8);
                float lum = dot(print, vec3(0.299, 0.587, 0.114));
                float gloss = mix(1.0, 0.45, smoothstep(0.55, 0.9, lum));
                
                vec3 spec = holo * gloss * mix(vec3(1.0), print * 2.4 + 0.08, 0.65) * (0.34 * key + 0.11 * strip + 0.07 * side + 0.02 * fill);
                
                vec3 colour = print * shade + spec + holo * print * 0.6 * pow(1.0 - nv, 3.0);
                
                if (back) {
                    vec3 foil = vec3(0.30, 0.22, 0.52) * (0.35 + 0.9 * nl) + spec * 1.3;
                    colour = mix(foil, print * shade, 0.38);
                }
                
                colour = min(colour, vec3(0.8)) + 0.2 * (1.0 - exp(-max(colour - 0.8, 0.0) / 0.2));
                colour = pow(colour, vec3(1.0 / 2.2));
                
                gl_FragColor = vec4(colour, 1.0);
            }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
        if (!vs || !fs) {
            hero.classList.add('no-cloth');
            return;
        }

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            hero.classList.add('no-cloth');
            return;
        }
        gl.useProgram(program);

        const posLoc = gl.getAttribLocation(program, "aPos");
        const normLoc = gl.getAttribLocation(program, "aNormal");
        const uvLoc = gl.getAttribLocation(program, "aUv");
        const resLoc = gl.getUniformLocation(program, "uResolution");
        const texLoc = gl.getUniformLocation(program, "uTexture");
        const hasTexLoc = gl.getUniformLocation(program, "uHasTexture");

        // --- SIMULATION SETTINGS ---
        const COLS = 46;
        const ROWS = 42;
        const SIZE = 0.90;
        const ASPECT = 1.12;
        const CW = SIZE * ASPECT;
        const CH = SIZE;
        
        const NUM_POINTS = COLS * ROWS;
        const points = [];
        const prevPoints = [];
        const pins = [0, COLS - 1]; // Top left and top right
        
        const restZ = [];
        const constraints = [];
        
        const crumple = 0.55;
        
        // Initialize flat points
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const u = c / (COLS - 1);
                const v = r / (ROWS - 1);
                const x = (u - 0.5) * CW;
                const y = (v - 0.5) * CH;
                
                // Crease math
                const z = crumple * 0.045 * CH * (
                    ridge(2.7*u + 2.9*v + 0.7) + 
                    0.8 * ridge(-2.6*u + 3.3*v + 2.1) + 
                    0.5 * Math.sin(4.9*u - 1.4*v + 2.2) + 
                    0.55 * ridge(1.1*u + 6.4*v + 1.3) + 
                    0.4 * ridge(8.3*u + 3.9*v + 0.2) + 
                    0.3 * ridge(-5.7*u + 9.1*v + 1.6)
                );
                
                restZ.push(z);
                points.push({ x: x, y: y, z: z, u, v, px: x, py: y, pz: z });
                prevPoints.push({ x: x, y: y, z: z });
            }
        }

        // Pins
        const half = 0.5 * CW * 0.98;
        const top = 0.5 * CH;
        const roll = 5.5 * Math.PI / 180;
        
        const p0 = points[pins[0]];
        p0.x = -half * Math.cos(roll);
        p0.y = top + half * Math.sin(roll);
        p0.z = 0;
        p0.px = p0.x; p0.py = p0.y; p0.pz = p0.z;
        
        const p1 = points[pins[1]];
        p1.x = half * Math.cos(roll);
        p1.y = top - half * Math.sin(roll);
        p1.z = 0;
        p1.px = p1.x; p1.py = p1.y; p1.pz = p1.z;

        // Rotate whole sheet to match pins initially
        for (let i = 0; i < points.length; i++) {
            if (pins.includes(i)) continue;
            const p = points[i];
            const spreadX = p.x * 0.98 + (1 - 0.98) * Math.pow(1 - p.v, 2);
            const dx = spreadX;
            const dy = p.y - top;
            p.x = dx * Math.cos(roll) - dy * Math.sin(roll);
            p.y = dx * Math.sin(roll) + dy * Math.cos(roll) + top;
            p.px = p.x; p.py = p.y;
        }

        // Build constraints
        function addConstraint(i1, i2, stiffness) {
            const p1 = points[i1], p2 = points[i2];
            const dx = p1.x - p2.x, dy = p1.y - p2.y, dz = p1.z - p2.z;
            constraints.push({ i1, i2, rest: Math.sqrt(dx*dx + dy*dy + dz*dz), stiffness });
        }

        const bend = 0.02 + (0.60 - 0.02) * 0.60;

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const i = r * COLS + c;
                if (c < COLS - 1) addConstraint(i, i + 1, 1);
                if (r < ROWS - 1) addConstraint(i, i + COLS, 1);
                if (c < COLS - 1 && r < ROWS - 1) {
                    addConstraint(i, i + COLS + 1, 0.5);
                    addConstraint(i + 1, i + COLS, 0.5);
                }
                if (c < COLS - 2) addConstraint(i, i + 2, bend);
                if (r < ROWS - 2) addConstraint(i, i + COLS * 2, bend);
                if (c < COLS - 5) addConstraint(i, i + 5, bend * 0.5);
                if (r < ROWS - 5) addConstraint(i, i + COLS * 5, bend * 0.5);
            }
        }

        // Tethers
        const tetherRest0 = [];
        const tetherRest1 = [];
        const tetherStiff = 0.60;
        for (let i = 0; i < NUM_POINTS; i++) {
            if (pins.includes(i)) continue;
            const p = points[i], p0 = points[pins[0]], p1 = points[pins[1]];
            const dx0 = p.x - p0.x, dy0 = p.y - p0.y, dz0 = p.z - p0.z;
            const dx1 = p.x - p1.x, dy1 = p.y - p1.y, dz1 = p.z - p1.z;
            tetherRest0.push(Math.sqrt(dx0*dx0 + dy0*dy0 + dz0*dz0));
            tetherRest1.push(Math.sqrt(dx1*dx1 + dy1*dy1 + dz1*dz1));
        }

        // Pre-warm
        for (let i = 0; i < 360; i++) {
            simulate(1/240, 1.0); // high damping
        }

        // --- MAIN SIMULATION ---
        function simulate(dt, dampOverride) {
            const damp = dampOverride !== undefined ? dampOverride : 0.30;
            const gravity = 2.6;
            const flutter = 0.35;
            const time = 0; // For prewarm, no wind
            
            const dampFactor = Math.exp(-(0.15 + 5.85 * damp) * dt);
            const wind = 0;
            
            // Verlet integration
            for (let i = 0; i < NUM_POINTS; i++) {
                if (pins.includes(i)) continue;
                const p = points[i];
                const vx = (p.x - p.px) * dampFactor;
                const vy = (p.y - p.py) * dampFactor;
                const vz = (p.z - p.pz) * dampFactor;
                
                p.px = p.x; p.py = p.y; p.pz = p.z;
                p.x += vx;
                p.y += vy - gravity * dt * dt;
                p.z += vz;
            }
            
            // Constraints
            for (let c = 0; c < constraints.length; c++) {
                const con = constraints[c];
                const p1 = points[con.i1], p2 = points[con.i2];
                const dx = p1.x - p2.x, dy = p1.y - p2.y, dz = p1.z - p2.z;
                const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                if (dist === 0) continue;
                
                const diff = (dist - con.rest) / dist;
                const move = diff * con.stiffness;
                
                const w1 = pins.includes(con.i1) ? 0 : 0.5;
                const w2 = pins.includes(con.i2) ? 0 : 0.5;
                const totalW = w1 + w2;
                if (totalW === 0) continue;
                
                const f1 = w1 / totalW;
                const f2 = w2 / totalW;
                
                p1.x -= dx * move * f1;
                p1.y -= dy * move * f1;
                p1.z -= dz * move * f1;
                
                p2.x += dx * move * f2;
                p2.y += dy * move * f2;
                p2.z += dz * move * f2;
            }

            // Tethers
            let ti = 0;
            for (let i = 0; i < NUM_POINTS; i++) {
                if (pins.includes(i)) continue;
                const p = points[i];
                
                for (let pinIdx = 0; pinIdx < 2; pinIdx++) {
                    const pPin = points[pins[pinIdx]];
                    const dx = p.x - pPin.x, dy = p.y - pPin.y, dz = p.z - pPin.z;
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    const maxDist = (pinIdx === 0 ? tetherRest0[ti] : tetherRest1[ti]) * 1.02;
                    
                    if (dist > maxDist) {
                        const scale = maxDist / dist;
                        p.x = pPin.x + dx * scale;
                        p.y = pPin.y + dy * scale;
                        p.z = pPin.z + dz * scale;
                    }
                }
                ti++;
            }
        }

        // --- RENDERING ---
        const numIndices = (COLS - 1) * (ROWS - 1) * 6;
        const indices = new Uint16Array(numIndices);
        let idx = 0;
        for (let r = 0; r < ROWS - 1; r++) {
            for (let c = 0; c < COLS - 1; c++) {
                const a = r * COLS + c;
                const b = a + 1;
                const cIdx = a + COLS;
                const d = cIdx + 1;
                indices[idx++] = a; indices[idx++] = cIdx; indices[idx++] = b;
                indices[idx++] = b; indices[idx++] = cIdx; indices[idx++] = d;
            }
        }
        const indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

        const posBuffer = gl.createBuffer();
        const normBuffer = gl.createBuffer();
        const uvBuffer = gl.createBuffer();
        
        const positions = new Float32Array(NUM_POINTS * 3);
        const normals = new Float32Array(NUM_POINTS * 3);
        const uvs = new Float32Array(NUM_POINTS * 2);
        
        for (let i = 0; i < NUM_POINTS; i++) {
            uvs[i*2] = points[i].u;
            uvs[i*2+1] = 1 - points[i].v;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.STATIC_DRAW);

        let texture = gl.createTexture();
        let hasTex = 0;

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            
            const ext = gl.getExtension('EXT_texture_filter_anisotropic') || gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
            if (ext) {
                gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
            }
            gl.generateMipmap(gl.TEXTURE_2D);
            hasTex = 1;
            render(0);
        };
        img.onerror = () => {
            hero.classList.add('no-cloth');
        };
        img.src = imgUrl;

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = hero.clientWidth;
            const h = hero.clientHeight;
            if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                gl.viewport(0, 0, canvas.width, canvas.height);
                if (resLoc) gl.uniform2f(resLoc, w, h);
            }
        }
        window.addEventListener('resize', resize);
        new ResizeObserver(resize).observe(hero);
        resize();

        let pointerDown = false;
        let grabbedPoint = -1;
        let grabDepth = 0;
        let grabOffset = { x: 0, y: 0 };
        const grabRadius = 0.12;
        const carryRadius = 0.20;

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX;
            const clientY = e.clientY;
            const nx = (clientX - rect.left) / rect.width;
            const ny = (clientY - rect.top) / rect.height;
            
            // approximation
            const aspectRatio = rect.width / rect.height;
            const cx = aspectRatio >= 1.25 ? 0.402 : 0.5;
            const cy = aspectRatio >= 1.25 ? 0.485 : (aspectRatio < 0.75 ? 0.41 : 0.43);
            const zoom = aspectRatio >= 1.25 ? Math.min(1, 0.58 * aspectRatio / (CW * 1.12)) : Math.min(1, 0.92 * aspectRatio / (CW * 1.12), (aspectRatio < 0.75 ? 0.60 : 0.66) / CH);
            
            const x = (nx - cx) * aspectRatio / zoom;
            const y = (cy - ny) / zoom;
            return { x, y, nx, ny };
        }

        canvas.addEventListener('pointerdown', (e) => {
            const mouse = getMousePos(e);
            
            let bestScore = Infinity;
            let bestIdx = -1;
            for (let i = 0; i < NUM_POINTS; i++) {
                const p = points[i];
                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < grabRadius) {
                    const score = dist - 0.08 * (-p.z); // using z as proxy for view depth
                    if (score < bestScore) {
                        bestScore = score;
                        bestIdx = i;
                    }
                }
            }
            
            if (bestIdx !== -1) {
                grabbedPoint = bestIdx;
                grabDepth = points[bestIdx].z;
                grabOffset.x = points[bestIdx].x - mouse.x;
                grabOffset.y = points[bestIdx].y - mouse.y;
                pointerDown = true;
                canvas.classList.add('is-held');
                canvas.setPointerCapture(e.pointerId);
                e.preventDefault();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!pointerDown) return;
            const mouse = getMousePos(e);
            const targetX = mouse.x + grabOffset.x;
            const targetY = mouse.y + grabOffset.y;
            
            const p = points[grabbedPoint];
            const dx = targetX - p.x;
            const dy = targetY - p.y;
            
            for (let i = 0; i < NUM_POINTS; i++) {
                if (pins.includes(i)) continue;
                const pt = points[i];
                const d = Math.sqrt(Math.pow(pt.x - p.x, 2) + Math.pow(pt.y - p.y, 2)) / (carryRadius * CH);
                if (d < 1) {
                    const weight = Math.pow(1 - d*d, 2);
                    pt.x += dx * weight;
                    pt.y += dy * weight;
                    // Don't update prevPoints to not add velocity
                }
            }
            e.preventDefault();
        });

        function release(e) {
            if (pointerDown) {
                pointerDown = false;
                grabbedPoint = -1;
                canvas.classList.remove('is-held');
                canvas.releasePointerCapture(e.pointerId);
            }
        }
        canvas.addEventListener('pointerup', release);
        canvas.addEventListener('pointercancel', release);
        canvas.addEventListener('lostpointercapture', release);

        let isVisible = true;
        new IntersectionObserver(entries => {
            isVisible = entries[0].isIntersecting;
        }).observe(hero);

        let rafId;
        let lastTime = 0;
        let simTime = 0;

        function render(now) {
            if (!isVisible || document.hidden) {
                rafId = requestAnimationFrame(render);
                return;
            }
            
            if (lastTime === 0) lastTime = now;
            const dt = Math.min((now - lastTime) / 1000, 1/30);
            lastTime = now;
            
            if (dt > 0) {
                simTime += dt;
                const subSteps = 8;
                const h = dt / subSteps;
                
                const damp = 0.30;
                const gravity = 2.6;
                const flutter = 0.35;
                
                const dampFactor = Math.exp(-(0.15 + 5.85 * damp) * h);
                const gust = 0.6 + 0.4 * Math.sin(0.37 * simTime) * Math.sin(0.23 * simTime + 1.0);
                let wind = flutter * 2.4 * gust * (gravity / 2.6);
                
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (reducedMotion) wind = 0;

                for (let s = 0; s < subSteps; s++) {
                    for (let i = 0; i < NUM_POINTS; i++) {
                        if (pins.includes(i) || (pointerDown && i === grabbedPoint)) continue;
                        const p = points[i];
                        const vx = (p.x - p.px) * dampFactor;
                        const vy = (p.y - p.py) * dampFactor;
                        const vz = (p.z - p.pz) * dampFactor;
                        
                        const s1 = Math.sin(9.1 * p.u - 3.7 * p.v + 3.1 * simTime);
                        const s2 = Math.sin(6.3 * p.u + 7.9 * p.v - 2.3 * simTime + 1.3);
                        const s3 = Math.sin(2.9 * p.u + 1.7 * simTime + 0.8 * Math.sin(0.5 * simTime)) * Math.cos(2.3 * p.v - 0.9 * simTime);
                        
                        const ax = wind * 0.25 * Math.sin(3.3 * p.v + 1.1 * simTime + p.u);
                        const ay = wind * 0.1 * s2 - gravity;
                        const az = wind * (0.45 * s1 + 0.35 * s2 + 0.3 * s3);
                        
                        p.px = p.x; p.py = p.y; p.pz = p.z;
                        p.x += vx + ax * h * h;
                        p.y += vy + ay * h * h;
                        p.z += vz + az * h * h;
                    }
                    
                    for (let c = 0; c < constraints.length; c++) {
                        const con = constraints[c];
                        const p1 = points[con.i1], p2 = points[con.i2];
                        const dx = p1.x - p2.x, dy = p1.y - p2.y, dz = p1.z - p2.z;
                        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                        if (dist === 0) continue;
                        
                        const diff = (dist - con.rest) / dist;
                        const move = diff * con.stiffness;
                        
                        const isP1Fixed = pins.includes(con.i1) || (pointerDown && con.i1 === grabbedPoint);
                        const isP2Fixed = pins.includes(con.i2) || (pointerDown && con.i2 === grabbedPoint);
                        
                        const w1 = isP1Fixed ? 0 : 0.5;
                        const w2 = isP2Fixed ? 0 : 0.5;
                        const totalW = w1 + w2;
                        if (totalW === 0) continue;
                        
                        if (!isP1Fixed) {
                            p1.x -= dx * move * (w1 / totalW);
                            p1.y -= dy * move * (w1 / totalW);
                            p1.z -= dz * move * (w1 / totalW);
                        }
                        if (!isP2Fixed) {
                            p2.x += dx * move * (w2 / totalW);
                            p2.y += dy * move * (w2 / totalW);
                            p2.z += dz * move * (w2 / totalW);
                        }
                    }

                    // Tethers
                    let ti = 0;
                    for (let i = 0; i < NUM_POINTS; i++) {
                        if (pins.includes(i) || (pointerDown && i === grabbedPoint)) continue;
                        const p = points[i];
                        
                        for (let pinIdx = 0; pinIdx < 2; pinIdx++) {
                            const pPin = points[pins[pinIdx]];
                            const dx = p.x - pPin.x, dy = p.y - pPin.y, dz = p.z - pPin.z;
                            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                            const maxDist = (pinIdx === 0 ? tetherRest0[ti] : tetherRest1[ti]) * 1.02;
                            
                            if (dist > maxDist) {
                                const scale = maxDist / dist;
                                p.x = pPin.x + dx * scale;
                                p.y = pPin.y + dy * scale;
                                p.z = pPin.z + dz * scale;
                            }
                        }
                        ti++;
                    }
                }
            }

            // Update buffers
            for (let i = 0; i < NUM_POINTS; i++) {
                positions[i*3] = points[i].x;
                positions[i*3+1] = points[i].y;
                positions[i*3+2] = points[i].z;
            }

            // Normals
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const i = r * COLS + c;
                    let left = c > 0 ? i - 1 : i;
                    let right = c < COLS - 1 ? i + 1 : i;
                    let down = r > 0 ? i - COLS : i;
                    let up = r < ROWS - 1 ? i + COLS : i;
                    
                    const pL = points[left], pR = points[right], pD = points[down], pU = points[up];
                    const dx1 = pR.x - pL.x, dy1 = pR.y - pL.y, dz1 = pR.z - pL.z;
                    const dx2 = pU.x - pD.x, dy2 = pU.y - pD.y, dz2 = pU.z - pD.z;
                    
                    let nx = dy1 * dz2 - dz1 * dy2;
                    let ny = dz1 * dx2 - dx1 * dz2;
                    let nz = dx1 * dy2 - dy1 * dx2;
                    
                    const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
                    normals[i*3] = nx / len;
                    normals[i*3+1] = ny / len;
                    normals[i*3+2] = nz / len;
                }
            }

            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, normBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, normals, gl.DYNAMIC_DRAW);
            gl.enableVertexAttribArray(normLoc);
            gl.vertexAttribPointer(normLoc, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
            gl.enableVertexAttribArray(uvLoc);
            gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 0, 0);

            gl.clearColor(0.89, 0.89, 0.91, 1.0); // var(--paper)
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            gl.enable(gl.DEPTH_TEST);
            gl.depthFunc(gl.LEQUAL);
            gl.disable(gl.BLEND);
            gl.disable(gl.CULL_FACE);

            gl.useProgram(program);
            gl.uniform1i(hasTexLoc, hasTex);
            if (hasTex) {
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.uniform1i(texLoc, 0);
            }

            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
            gl.drawElements(gl.TRIANGLES, numIndices, gl.UNSIGNED_SHORT, 0);

            rafId = requestAnimationFrame(render);
        }

        rafId = requestAnimationFrame(render);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                lastTime = 0; // reset time
                rafId = requestAnimationFrame(render);
            } else {
                cancelAnimationFrame(rafId);
            }
        });
    })();
</script>
</body>
</html>
